application:
  url: "https://llm-rag-testing-workshop.streamlit.app/Application"
  mode: "playwright"
  headless: false
  timeout_seconds: 60
  context_mode: "local_kb"

evaluation:
  enabled: true
  model: "gpt-4o-mini"
  embedding_model: "text-embedding-3-small"
  temperature: 0
  thresholds:
    relevance: 0.80
    faithfulness: 0.85
    precision: 0.80

execution:
  max_questions: 0
  pause_between_questions_seconds: 1.0
  retry_count: 2

reporting:
  output_dir: "reports"
